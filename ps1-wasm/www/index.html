<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Zig PS1 Emulator</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
        overflow: hidden;
      }

      canvas {
        position: fixed;
        inset: 0;
        margin: auto;
        /* The PS1 always outputs a 4:3 picture, whatever its internal
           resolution is -- 256/320/368/512/640 wide by 240/480 (NTSC) or
           256/512 (PAL) tall all have non-square pixels. Pin the element to a
           4:3 box and let the framebuffer stretch into it; sizing the box from
           the framebuffer instead makes the aspect swing per mode (512x256
           renders 2:1, 320x480 renders portrait). */
        width: min(100vw, calc(100vh * 4 / 3));
        height: min(100vh, calc(100vw * 3 / 4));
        image-rendering: pixelated;
        display: none;
      }

      #ui-layer {
        position: relative;
        z-index: 1;
        padding: 1rem;
        background: rgb(0 0 0 / 75%);
      }
    </style>
  </head>
  <body>
    <div id="ui-layer">
      <h2>Zig PS1</h2>
      <p>Select your BIOS and Game to boot with animation!</p>

      <div style="margin-bottom: 1rem;">
        <label>1. BIOS (SCPH1001.BIN):</label><br/>
        <input type="file" id="bios-upload" accept=".bin,.rom" />
      </div>

      <div style="margin-bottom: 1rem;">
        <label>2. Game folder (.cue + .bin) or single .bin / .exe:</label><br/>
        <input type="file" id="game-upload" webkitdirectory directory multiple />
      </div>

      <button id="boot-btn" style="padding: 0.5rem 1rem; font-size: 1.1rem; cursor: pointer; background: #555; color: white; border: 1px solid #777; border-radius: 4px;">Boot Console</button>
    </div>

    <canvas id="screen"></canvas>
    <script>
      const canvas = document.getElementById("screen");
      const ctx = canvas.getContext("2d");
      const uiLayer = document.getElementById("ui-layer");
      const biosInput = document.getElementById("bios-upload");
      const gameInput = document.getElementById("game-upload");
      const bootBtn = document.getElementById("boot-btn");
      let currentWidth = 0;
      let currentHeight = 0;
      let imageData = null;

      let wasmExports = null;
      let wasmMemory = null;
      let controllerButtons = 0xffff;
      const textDecoder = new TextDecoder();

      const keyToButtonBit = new Map([
        ["ShiftLeft", 0], // Select
        ["ShiftRight", 0],
        ["Enter", 3], // Start
        ["ArrowUp", 4],
        ["ArrowRight", 5],
        ["ArrowDown", 6],
        ["ArrowLeft", 7],
        ["KeyE", 8], // L2
        ["KeyR", 9], // R2
        ["KeyQ", 10], // L1
        ["KeyW", 11], // R1
        ["KeyS", 12], // Triangle
        ["KeyX", 13], // Circle
        ["KeyZ", 14], // Cross
        ["KeyA", 15], // Square
      ]);

      function setButtonPressed(bit, pressed) {
        if (pressed) {
          controllerButtons &= ~(1 << bit);
        } else {
          controllerButtons |= 1 << bit;
        }

        wasmExports?.setControllerButtons(controllerButtons);
      }

      function handleControllerKey(e, pressed) {
        const bit = keyToButtonBit.get(e.code);
        if (bit === undefined) return;
        e.preventDefault();
        setButtonPressed(bit, pressed);
      }

      async function init() {
        const response = await fetch("/zig-out/bin/emulator.wasm");
        const wasm = await WebAssembly.instantiateStreaming(response, {
          env: {
            jsConsoleLog: (ptr, len) => {
              const text = textDecoder.decode(
                new Uint8Array(wasmExports.memory.buffer, ptr, len),
              );
              console.log("[ZIG]", text);
            },
          },
        });

        wasmExports = wasm.instance.exports;
        wasmMemory = wasmExports.memory;

        wasmExports.init();
        wasmExports.setControllerButtons(controllerButtons);

        window.addEventListener("keydown", (e) => handleControllerKey(e, true));
        window.addEventListener("keyup", (e) => handleControllerKey(e, false));

        let audioCtx;
        let scriptNode;

        // Browsers require a user gesture to start audio
        document.addEventListener("click", async () => {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({
              sampleRate: 44100,
            });

            // Modern browsers often require an explicit resume
            if (audioCtx.state === "suspended") {
              await audioCtx.resume();
            }

            // Create a script processor to pull audio (buffer size 2048 or 4096)
            scriptNode = audioCtx.createScriptProcessor(2048, 0, 2);
            scriptNode.onaudioprocess = (audioProcessingEvent) => {
              if (!wasmExports) return;

              const outputBuffer = audioProcessingEvent.outputBuffer;
              const leftChannel = outputBuffer.getChannelData(0);
              const rightChannel = outputBuffer.getChannelData(1);

              const bufferSize = wasmExports.getAudioBufferSize();
              const audioPtr = wasmExports.getAudioBufferPtr();
              const writeIdx = wasmExports.getAudioWriteIdx();
              let readIdx = wasmExports.getAudioReadIdx();

              const wasmAudioView = new Float32Array(
                wasmMemory.buffer,
                audioPtr,
                bufferSize,
              );

              // Calculate how many samples are currently in the ring buffer
              let available =
                writeIdx >= readIdx
                  ? writeIdx - readIdx
                  : bufferSize - readIdx + writeIdx;

              // We need 2 floats per frame (Left + Right)
              const required = outputBuffer.length * 2;

              // If the emulator is running too slow to feed the browser, output silence to prevent horrible buzzing
              if (available < required) {
                for (let i = 0; i < outputBuffer.length; i++) {
                  leftChannel[i] = 0;
                  rightChannel[i] = 0;
                }
                return;
              }

              for (let i = 0; i < outputBuffer.length; i++) {
                leftChannel[i] = wasmAudioView[readIdx];
                readIdx = (readIdx + 1) % bufferSize;
                rightChannel[i] = wasmAudioView[readIdx];
                readIdx = (readIdx + 1) % bufferSize;
              }

              wasmExports.setAudioReadIdx(readIdx);
            };

            scriptNode.connect(audioCtx.destination);
            console.log("Audio initialized and resumed!");
          } else if (audioCtx.state === "suspended") {
            await audioCtx.resume();
            console.log("Audio resumed!");
          }
        });

        bootBtn.addEventListener("click", async () => {
          const biosFile = biosInput.files[0];
          if (!biosFile) {
            alert("Please select a BIOS file first.");
            return;
          }

          // 1. Load BIOS
          const biosBuffer = await biosFile.arrayBuffer();
          if (biosBuffer.byteLength !== 512 * 1024) {
            alert("Invalid BIOS file. Must be exactly 512KB.");
            return;
          }

          const biosPtr = wasmExports.getBiosPtr();
          const biosView = new Uint8Array(wasmMemory.buffer, biosPtr, 512 * 1024);
          biosView.set(new Uint8Array(biosBuffer));
          wasmExports.setBiosLoaded();

          // 2. Load Game if selected
          const files = Array.from(gameInput.files);
          if (files.length > 0) {
            // A multi-disc folder (Final Fantasy IX ships four) holds several
            // cues, so pick by name rather than by directory order -- which is
            // not specified and differs between browsers.
            const cueFiles = files.filter(f => f.name.toLowerCase().endsWith('.cue'))
                                  .sort((a, b) => a.name.localeCompare(b.name));
            const cueFile = cueFiles[0];
            if (cueFiles.length > 1) {
              console.warn("Folder holds " + cueFiles.length + " discs; booting '" +
                           cueFile.name + "'. There is no disc swap yet.");
            }

            // A LibCrypt title (much of the PAL Sony Europe catalogue) hides a
            // key in the subchannel Q of a few dozen sectors, which no .bin can
            // carry. The sidecar's records are disc-specific addresses, so the
            // one paired with THIS disc is the only one that means anything --
            // another disc's .sbi flags no sector of this one and leaves the
            // game looping on its check exactly as if none were supplied.
            const stageSbi = async (baseName) => {
              const stem = baseName.replace(/\.[^.]*$/, '').toLowerCase();
              const sbiFiles = files.filter(f => f.name.toLowerCase().endsWith('.sbi'));
              const sbiFile = sbiFiles.find(f => f.name.toLowerCase() === stem + '.sbi')
                           || (sbiFiles.length === 1 ? sbiFiles[0] : undefined);
              if (!sbiFile) {
                if (sbiFiles.length > 0) {
                  console.warn("Found .sbi files but none named '" + stem +
                               ".sbi'; booting without LibCrypt data.");
                }
                return;
              }
              const buf = new Uint8Array(await sbiFile.arrayBuffer());
              const ptr = wasmExports.allocSbiBuffer(buf.byteLength);
              new Uint8Array(wasmExports.memory.buffer).set(buf, ptr);
              console.log("SBI loaded: " + sbiFile.name + ", " +
                          ((buf.byteLength - 4) / 14) + " LibCrypt sectors");
            };

            if (cueFile) {
              // CUE+BIN path: parse cue, concat bins in cue order, emit REM FILESIZE
              const binsMap = new Map(
                files.filter(f => f.name.toLowerCase().endsWith('.bin'))
                     .map(f => [f.name, f])
              );

              const cueText = await cueFile.text();
              const orderedBins = [];
              let augmentedCue = '';
              for (const line of cueText.split(/\r?\n/)) {
                const m = line.match(/FILE\s+"([^"]+)"/i);
                if (m) {
                  const refName = m[1];
                  const bin = binsMap.get(refName) || binsMap.get(refName.split(/[\\/]/).pop());
                  if (!bin) { alert('Missing .bin referenced by cue: ' + refName); return; }
                  orderedBins.push(bin);
                  augmentedCue += 'REM FILESIZE ' + bin.size + '\n';
                }
                augmentedCue += line + '\n';
              }

              // Concatenate bins into wasm memory (re-fetch view after each alloc)
              const total = orderedBins.reduce((n, f) => n + f.size, 0);
              const cdPtr = wasmExports.allocCdBuffer(total);
              let off = cdPtr;
              for (const f of orderedBins) {
                const buf = new Uint8Array(await f.arrayBuffer());
                // Re-fetch after potential wasm memory growth from alloc
                new Uint8Array(wasmExports.memory.buffer).set(buf, off);
                off += buf.byteLength;
              }

              // Stage augmented cue text
              const enc = new TextEncoder().encode(augmentedCue);
              const cuePtr = wasmExports.allocCueBuffer(enc.length);
              new Uint8Array(wasmExports.memory.buffer).set(enc, cuePtr);

              await stageSbi(cueFile.name);
              wasmExports.loadCdFromBuffer();
              console.log("CD-ROM (cue+bin) loaded into memory: " + cueFile.name);

            } else {
              const binFiles = files.filter(f => f.name.toLowerCase().endsWith('.bin'));
              const exeFiles = files.filter(f => {
                const ext = f.name.split('.').pop().toLowerCase();
                return ext === 'exe' || ext === 'psexe';
              });

              if (binFiles.length > 0) {
                // Single raw .bin path: pick the largest bin as single-track image
                const binFile = binFiles.sort((a, b) => b.size - a.size)[0];
                const size = binFile.size;
                const cdPtr = wasmExports.allocCdBuffer(size);
                // Re-fetch view after alloc (wasm memory may have grown)
                const cdView = new Uint8Array(wasmExports.memory.buffer);
                cdView.set(new Uint8Array(await binFile.arrayBuffer()), cdPtr);

                await stageSbi(binFile.name);
                wasmExports.loadCdFromBuffer();
                console.log("CD-ROM (raw .bin) loaded into memory: " + binFile.name);

              } else if (exeFiles.length > 0) {
                // PS-EXE sideload path (preserved from original)
                const exeFile = exeFiles[0];
                const gameBuffer = await exeFile.arrayBuffer();
                const size = gameBuffer.byteLength;
                const exePtr = wasmExports.allocExeBuffer(size);
                // Re-fetch view after alloc (wasm memory may have grown)
                const exeView = new Uint8Array(wasmExports.memory.buffer);
                exeView.set(new Uint8Array(gameBuffer), exePtr);

                // Stage it for sideloading after BIOS initializes memory (~1 second delay)
                wasmExports.stageExeForSideload();
                console.log("PS-EXE staged for sideloading to skip BIOS animation.");
              }
            }
          }

          // 3. Start GUI
          uiLayer.style.display = "none";
          canvas.style.display = "block";
          window.focus();
        });

        requestAnimationFrame(loop);
      }

      function loop() {
        wasmExports.stepFrame();

        if (!wasmExports.isDisplayEnabled()) {
          // Hardware outputs black when display is masked
          ctx.fillStyle = "black";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          requestAnimationFrame(loop);
          return;
        }

        const width = wasmExports.getDisplayWidth();
        const height = wasmExports.getDisplayHeight();
        const startX = wasmExports.getDisplayVramX();
        const startY = wasmExports.getDisplayVramY();

        // Resize Canvas if the PS1 changes display modes
        if (width !== currentWidth || height !== currentHeight) {
          canvas.width = width;
          canvas.height = height;
          currentWidth = width;
          currentHeight = height;
          imageData = ctx.createImageData(width, height);
        }

        const vramPtr = wasmExports.getVramPtr();
        const is24Bit = wasmExports.is24BitMode();

        if (is24Bit) {
          const vramView = new Uint8Array(
            wasmMemory.buffer,
            vramPtr,
            1024 * 512 * 2,
          );
          for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
              // In 24-bit mode, each pixel takes 3 bytes (1.5 words).
              // startX is still in 16-bit units (words).
              const byteX = (startX * 2 + x * 3) % 2048;
              const vramY = (startY + y) % 512;
              const byteOffset = vramY * 2048 + byteX;
              // Restored to R, G, B.
              const r = vramView[byteOffset + 0];
              const g = vramView[byteOffset + 1];
              const b = vramView[byteOffset + 2];

              const outIdx = (y * width + x) * 4;
              imageData.data[outIdx + 0] = r;
              imageData.data[outIdx + 1] = g;
              imageData.data[outIdx + 2] = b;
              imageData.data[outIdx + 3] = 255;
            }
          }
        } else {
          const vramView = new Uint16Array(
            wasmMemory.buffer,
            vramPtr,
            1024 * 512,
          );
          for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
              const vramX = (startX + x) & 0x3ff;
              const vramY = (startY + y) & 0x1ff;
              const vramIdx = vramY * 1024 + vramX;
              const color16 = vramView[vramIdx];

              // Restored to r=low, b=high.
              const r = (color16 & 0x001f) << 3;
              const g = ((color16 >> 5) & 0x001f) << 3;
              const b = ((color16 >> 10) & 0x001f) << 3;

              const outIdx = (y * width + x) * 4;
              imageData.data[outIdx + 0] = r;
              imageData.data[outIdx + 1] = g;
              imageData.data[outIdx + 2] = b;
              imageData.data[outIdx + 3] = 255;
            }
          }
        }

        ctx.putImageData(imageData, 0, 0);
        requestAnimationFrame(loop);
      }

      init();
    </script>
  </body>
</html>
