<!doctype html>
<!-- A demo on the ps1-web package. `zig build web`, serve the repo root, open /ps1-wasm/www/. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Substation</title>
    <style>
      body { background: #111; color: #ddd; font: 14px system-ui; margin: 16px; }
      canvas { width: min(100%, 960px); aspect-ratio: 4 / 3; background: #000; image-rendering: pixelated; display: block; }
      label, button { margin: 0 12px 8px 0; display: inline-block; }
    </style>
  </head>
  <body>
    <label>BIOS <input id="bios" type="file" /></label>
    <label>Disc <input id="disc" type="file" multiple /></label>
    <button id="run">Start</button>
    <button id="reset">Reset</button>
    <button id="save">Save state</button>
    <button id="load">Load state</button>
    <span id="status"></span>
    <canvas id="screen"></canvas>
    <script type="module">
      import { Ps1Core, AUDIO_SAMPLE_RATE, discFromFiles, toBytes } from '../../ps1-web/dist/index.js';

      const $ = (id) => document.getElementById(id);
      const status = (text) => ($('status').textContent = text);
      const core = await Ps1Core.create(new URL('../../ps1-web/dist/ps1.wasm', import.meta.url));
      core.setCpuEngine('cached');
      const ctx = $('screen').getContext('2d');
      let audio, audioTime = 0, running = false, state = null;

      // Bits in `sio.zig`'s order; a 0 bit is PRESSED.
      const keys = { ShiftLeft: 0, Enter: 3, ArrowUp: 4, ArrowRight: 5, ArrowDown: 6, ArrowLeft: 7,
        KeyE: 8, KeyR: 9, KeyQ: 10, KeyW: 11, KeyS: 12, KeyX: 13, KeyZ: 14, KeyA: 15 };
      let buttons = 0xffff;
      const key = (down) => (e) => {
        const bit = keys[e.code];
        if (bit === undefined || e.target instanceof HTMLInputElement) return;
        e.preventDefault();
        buttons = down ? buttons & ~(1 << bit) : buttons | (1 << bit);
        core.setButtons(buttons);
      };
      addEventListener('keydown', key(true));
      addEventListener('keyup', key(false));
      addEventListener('blur', () => core.setButtons((buttons = 0xffff)));

      const guard = (fn) => async (...args) => { try { await fn(...args); } catch (e) { status(e.message); } };
      $('bios').onchange = guard(async (e) => {
        const info = core.loadBios(await toBytes(e.target.files[0]));
        status(info.known ? info.description : 'Unidentified BIOS');
      });
      $('disc').onchange = guard(async (e) => {
        const disc = await discFromFiles(e.target.files);
        const bytes = { bin: await toBytes(disc.bin), cue: disc.cue, sbi: disc.sbi && (await toBytes(disc.sbi)) };
        core.loadDisc(bytes);
        const id = core.identifyDisc(bytes.bin);
        status(id.title || id.serial || disc.name);
      });
      $('reset').onclick = guard(() => core.reset());
      $('save').onclick = guard(() => { state = core.saveState(); status(`Saved ${state.length} bytes`); });
      $('load').onclick = guard(() => state && core.loadState(state));
      $('run').onclick = () => {
        // An AudioContext may only start inside a user gesture.
        audio ??= new AudioContext({ sampleRate: AUDIO_SAMPLE_RATE });
        audio.resume();
        running = !running;
        $('run').textContent = running ? 'Pause' : 'Start';
      };

      // Each drained chunk is scheduled right after the last, a little ahead of now.
      function playAudio(samples) {
        if (!audio || samples.length === 0) return;
        const frames = samples.length / 2;
        const buffer = audio.createBuffer(2, frames, AUDIO_SAMPLE_RATE);
        const [l, r] = [buffer.getChannelData(0), buffer.getChannelData(1)];
        for (let i = 0; i < frames; i++) { l[i] = samples[2 * i]; r[i] = samples[2 * i + 1]; }
        const node = audio.createBufferSource();
        node.buffer = buffer;
        node.connect(audio.destination);
        audioTime = Math.max(audioTime, audio.currentTime + 0.05);
        node.start(audioTime);
        audioTime += buffer.duration;
      }

      function tick() {
        if (running) {
          core.runFrame();
          const f = core.frame();
          if (ctx.canvas.width !== f.width || ctx.canvas.height !== f.height) {
            ctx.canvas.width = f.width;
            ctx.canvas.height = f.height;
          }
          ctx.putImageData(new ImageData(f.rgba.slice(), f.width, f.height), 0, 0);
          playAudio(core.readAudio());
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
