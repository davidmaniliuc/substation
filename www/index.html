<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zig PS1 Emulator</title>
    <style>
        body { background: #111; color: white; text-align: center; font-family: sans-serif; }
        canvas { background: #000; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
    </style>
</head>
<body>
    <h1>PS1 WebAssembly Core</h1>
    <!-- The PS1 VRAM is 1024x512 -->
    <canvas id="screen" width="1024" height="512"></canvas>

    <script>
        const canvas = document.getElementById('screen');
        const ctx = canvas.getContext('2d');
        const imageData = ctx.createImageData(1024, 512);
        
        // This maps exactly to our 32-bit canvas pixel array
        const canvasBuffer32 = new Uint32Array(imageData.data.buffer);

        async function start() {
            // Load and instantiate the Zig WASM binary
            const response = await fetch('../zig-out/bin/emulator.wasm');
            const bytes = await response.arrayBuffer();
            const { instance } = await WebAssembly.instantiate(bytes, {
                env: {
                    // If you have any std.debug.print in your zig code, WASM needs a dummy function 
                    // to avoid crashing, though ReleaseFast/Small usually strips them out.
                }
            });

            const wasm = instance.exports;

            console.log("Initializing core...");
            wasm.init();

            // Get the memory pointer to our 1024x512 u16 array
            const vramPtr = wasm.getVramPtr();

            function loop() {
                // 1. Tell Zig to run the CPU/GPU for 1 frame
                wasm.stepFrame();

                // 2. Map the Zig memory into JS
                // We use Uint16Array because VRAM is u16.
                const vram = new Uint16Array(wasm.memory.buffer, vramPtr, 1024 * 512);

                // 3. Convert PS1 16-bit (1-5-5-5) to Canvas 32-bit (ABGR)
                for (let i = 0; i < vram.length; i++) {
                    const p = vram[i];
                    
                    // PS1 format: [1 bit semi-trans] [5 bit Blue] [5 bit Green] [5 bit Red]
                    const r = (p & 0x1F) << 3;
                    const g = ((p >> 5) & 0x1F) << 3;
                    const b = ((p >> 10) & 0x1F) << 3;
                    
                    // Canvas expects Little-Endian 32-bit (0xAABBGGRR)
                    canvasBuffer32[i] = 0xFF000000 | (b << 16) | (g << 8) | r;
                }

                // 4. Draw to the screen
                ctx.putImageData(imageData, 0, 0);

                // 5. Loop!
                requestAnimationFrame(loop);
            }

            console.log("Starting emulator loop!");
            loop();
        }

        start();
    </script>
</body>
</html>
