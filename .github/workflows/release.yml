# Builds Substation.app, packs it into a DMG and publishes a GitHub release.
#
# Releases are cut by hand, never by a push: Actions > Release > Run workflow,
# on the branch to release. Untick "publish" to only build the DMG and attach
# it to the run as an artifact.
#
# A release is numbered SERIES.N (N = this workflow's run number, so it only
# ever goes up; a gap is a run that did not publish) and titled with the
# commit it was built from: "Substation 0.1.42 (a3f91c2)". Bump SERIES by hand
# when a later stage deserves it. Nothing is ever typed per release.
#
# See docs/RELEASING.md for the Homebrew tap and what signing would add.
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release and update the Homebrew tap"
        type: boolean
        default: true

env:
  SERIES: "0.1"
  # Every release is a GitHub pre-release while the app is alpha. Set this to
  # "false" when a release should be shown as Latest.
  PRERELEASE: "true"
  # The image's default Xcode is 27.0; it also carries 27.1 and a 27.2 beta.
  # Set this (e.g. "27.1") to build with the same version as your own Mac.
  XCODE: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # macOS 27 + Xcode 27, what the app is developed on: a release should be
    # built by the Xcode it was tested with. GitHub names this image
    # "xcode-27" and still lists it as a beta, outside the Actions SLA; move
    # to "macos-27" once that label is GA. The deployment target stays 26.0,
    # so the app still runs on macOS 26.
    runs-on: xcode-27
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.dmg.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          # Three integers: CFBundleShortVersionString allows nothing else,
          # and Homebrew needs a version that sorts. The commit goes in the
          # release title instead.
          version="$SERIES.$GITHUB_RUN_NUMBER"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Version $version (${GITHUB_SHA::7})"

      # Reads minimum_zig_version (0.17.0) out of build.zig.zon.
      - uses: mlugg/setup-zig@v2

      - name: Xcode and the Metal toolchain
        run: |
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "/Applications/Xcode_$XCODE.app"
          fi
          xcodebuild -version
          # Since Xcode 16.3 `metal` is a separate component; build.zig's
          # metallib step fails without it.
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version

      - name: Build Substation.app
        env:
          SUBSTATION_VERSION: ${{ steps.version.outputs.version }}
          SUBSTATION_BUILD: ${{ github.run_number }}
        run: zig build macos

      - name: Pack the DMG
        id: dmg
        run: |
          ps1-macos/package-dmg.sh "${{ steps.version.outputs.version }}"
          echo "sha256=$(cut -d' ' -f1 "zig-out/Substation-${{ steps.version.outputs.version }}.dmg.sha256")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Substation-${{ steps.version.outputs.version }}
          path: |
            zig-out/Substation-*.dmg
            zig-out/Substation-*.dmg.sha256
          if-no-files-found: error

      - name: Publish the GitHub release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          cat > notes.md <<'EOF'
          > [!WARNING]
          > Substation is **alpha** software: expect crashes, missing features, and resume states that a later release may not load. Apple silicon and macOS 26 or later only. No BIOS is included.

          ### Install

          **Homebrew:** `brew install --cask davidmaniliuc/tap/substation`

          **DMG:** open it and drag Substation to Applications. The app is not notarized yet, so the first launch is blocked: open **System Settings ▸ Privacy & Security** and click **Open Anyway**, or run `xattr -dr com.apple.quarantine /Applications/Substation.app`.
          EOF
          flags=()
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          echo "" >> notes.md
          echo "Built from $GITHUB_SHA." >> notes.md
          # gh creates the tag at the commit that was built.
          gh release create "v$VERSION" \
            "zig-out/Substation-$VERSION.dmg" \
            "zig-out/Substation-$VERSION.dmg.sha256" \
            --target "$GITHUB_SHA" \
            --title "Substation $VERSION ($COMMIT)" \
            --notes-file notes.md \
            --generate-notes \
            "${flags[@]}"

  homebrew:
    # Runs only once the tap exists and a token for it is stored: create
    # davidmaniliuc/homebrew-tap and a HOMEBREW_TAP_TOKEN secret first
    # (docs/RELEASING.md). Without the secret this job is skipped, not failed.
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check for the tap token
        id: token
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew tap update."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          repository: davidmaniliuc/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Bump Casks/substation.rb
        if: steps.token.outputs.present == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          # The cask lives in the tap, not in this repo: only its version and
          # sha256 lines are rewritten, so everything else in it is edited
          # there by hand and survives every release.
          cask=tap/Casks/substation.rb
          if [ ! -f "$cask" ]; then
            echo "::error::$cask is missing; add the cask to davidmaniliuc/homebrew-tap first (docs/RELEASING.md)."
            exit 1
          fi
          sed -i -E \
            -e "s/^(  version )\".*\"/\1\"$VERSION\"/" \
            -e "s/^(  sha256 )\".*\"/\1\"$SHA256\"/" \
            "$cask"
          grep -q "^  version \"$VERSION\"" "$cask" && grep -q "^  sha256 \"$SHA256\"" "$cask" || {
            echo "::error::could not find the version/sha256 lines in $cask"; exit 1; }
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/substation.rb
          if git diff --cached --quiet; then
            echo "Cask already at $VERSION"
            exit 0
          fi
          git commit -m "substation $VERSION"
          git push
