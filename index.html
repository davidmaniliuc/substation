<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Zig PS1 Emulator</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
        overflow: hidden;
      }

      canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        image-rendering: pixelated;
        display: none;
      }

      #ui-layer {
        position: relative;
        z-index: 1;
        padding: 1rem;
        background: rgb(0 0 0 / 75%);
      }
    </style>
  </head>
  <body>
    <div id="ui-layer">
      <h2>Zig PS1</h2>
      <p>1. Start by booting the BIOS</p>
      <input type="file" id="bios-upload" accept=".bin,.rom" />

      <div
        id="exe-section"
        style="
          display: none;
          margin-top: 2rem;
          border-top: 1px solid #444;
          padding-top: 1rem;
        "
      >
        <p>
          2. Optional: Sideload a PS-EXE<br /><small
            >Wait a few seconds for the BIOS to initialize first.</small
          >
        </p>
        <input type="file" id="exe-upload" accept=".exe,.psexe" />
      </div>
    </div>

    <canvas id="screen"></canvas>
    <script>
      const canvas = document.getElementById("screen");
      const ctx = canvas.getContext("2d");
      const uiLayer = document.getElementById("ui-layer");
      const biosInput = document.getElementById("bios-upload");
      const exeSection = document.getElementById("exe-section");
      const exeInput = document.getElementById("exe-upload");
      let currentWidth = 0;
      let currentHeight = 0;
      let imageData = null;

      let wasmExports = null;
      let wasmMemory = null;
      let controllerButtons = 0xffff;
      const textDecoder = new TextDecoder();

      const keyToButtonBit = new Map([
        ["ShiftLeft", 0], // Select
        ["ShiftRight", 0],
        ["Enter", 3], // Start
        ["ArrowUp", 4],
        ["ArrowRight", 5],
        ["ArrowDown", 6],
        ["ArrowLeft", 7],
        ["KeyE", 8], // L2
        ["KeyR", 9], // R2
        ["KeyQ", 10], // L1
        ["KeyW", 11], // R1
        ["KeyS", 12], // Triangle
        ["KeyX", 13], // Circle
        ["KeyZ", 14], // Cross
        ["KeyA", 15], // Square
      ]);

      function setButtonPressed(bit, pressed) {
        if (pressed) {
          controllerButtons &= ~(1 << bit);
        } else {
          controllerButtons |= 1 << bit;
        }

        wasmExports?.setControllerButtons(controllerButtons);
      }

      function handleControllerKey(e, pressed) {
        const bit = keyToButtonBit.get(e.code);
        if (bit === undefined) return;
        e.preventDefault();
        setButtonPressed(bit, pressed);
      }

      async function init() {
        const response = await fetch("zig-out/bin/emulator.wasm");
        const wasm = await WebAssembly.instantiateStreaming(response, {
          env: {
            jsConsoleLog: (ptr, len) => {
              const text = textDecoder.decode(
                new Uint8Array(wasmExports.memory.buffer, ptr, len),
              );
              console.log("[ZIG]", text);
            },
          },
        });

        wasmExports = wasm.instance.exports;
        wasmMemory = wasmExports.memory;

        wasmExports.init();
        wasmExports.setControllerButtons(controllerButtons);

        window.addEventListener("keydown", (e) => handleControllerKey(e, true));
        window.addEventListener("keyup", (e) => handleControllerKey(e, false));

        biosInput.addEventListener("change", async (e) => {
          const file = e.target.files[0];
          if (!file) return;

          const buffer = await file.arrayBuffer();
          if (buffer.byteLength !== 512 * 1024) {
            alert("Invalid BIOS file. Must be exactly 512KB.");
            return;
          }

          const biosPtr = wasmExports.getBiosPtr();
          const biosView = new Uint8Array(
            wasmMemory.buffer,
            biosPtr,
            512 * 1024,
          );
          biosView.set(new Uint8Array(buffer));

          wasmExports.setBiosLoaded();

          biosInput.style.display = "none";
          exeSection.style.display = "block";
          canvas.style.display = "block";
        });

        exeInput.addEventListener("change", async (e) => {
          const file = e.target.files[0];
          if (!file) return;

          const buffer = await file.arrayBuffer();
          const size = buffer.byteLength;
          const exePtr = wasmExports.allocExeBuffer(size);
          const exeView = new Uint8Array(
            wasmExports.memory.buffer,
            exePtr,
            size,
          );
          exeView.set(new Uint8Array(buffer));

          wasmExports.loadExeAndRun();

          uiLayer.style.display = "none";
          window.focus();
        });

        requestAnimationFrame(loop);
      }

      function loop() {
        wasmExports.stepFrame();

        if (!wasmExports.isDisplayEnabled()) {
          requestAnimationFrame(loop);
          return;
        }

        const width = wasmExports.getDisplayWidth();
        const height = wasmExports.getDisplayHeight();
        const startX = wasmExports.getDisplayVramX();
        const startY = wasmExports.getDisplayVramY();

        // Resize Canvas if the PS1 changes display modes
        if (width !== currentWidth || height !== currentHeight) {
          canvas.width = width;
          canvas.height = height;
          currentWidth = width;
          currentHeight = height;
          imageData = ctx.createImageData(width, height);
        }

        const vramPtr = wasmExports.getVramPtr();
        const is24Bit = wasmExports.is24BitMode();

        if (is24Bit) {
          const vramView = new Uint8Array(
            wasmMemory.buffer,
            vramPtr,
            1024 * 512 * 2,
          );
          for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
              // In 24-bit mode, each pixel takes 3 bytes (1.5 words).
              // startX is still in 16-bit units (words).
              const byteOffset = (startY + y) * 2048 + (startX * 2 + x * 3);
              // Restored to R, G, B.
              const r = vramView[byteOffset + 0];
              const g = vramView[byteOffset + 1];
              const b = vramView[byteOffset + 2];

              const outIdx = (y * width + x) * 4;
              imageData.data[outIdx + 0] = r;
              imageData.data[outIdx + 1] = g;
              imageData.data[outIdx + 2] = b;
              imageData.data[outIdx + 3] = 255;
            }
          }
        } else {
          const vramView = new Uint16Array(
            wasmMemory.buffer,
            vramPtr,
            1024 * 512,
          );
          for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
              const vramX = (startX + x) & 0x3ff;
              const vramY = (startY + y) & 0x1ff;
              const vramIdx = vramY * 1024 + vramX;
              const color16 = vramView[vramIdx];

              // Restored to r=low, b=high.
              const r = (color16 & 0x001f) << 3;
              const g = ((color16 >> 5) & 0x001f) << 3;
              const b = ((color16 >> 10) & 0x001f) << 3;

              const outIdx = (y * width + x) * 4;
              imageData.data[outIdx + 0] = r;
              imageData.data[outIdx + 1] = g;
              imageData.data[outIdx + 2] = b;
              imageData.data[outIdx + 3] = 255;
            }
          }
        }

        ctx.putImageData(imageData, 0, 0);
        requestAnimationFrame(loop);
      }

      init();
    </script>
  </body>
</html>
