<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zig PS1 Emulator</title>
    <style>
        body { background: #111; color: white; display: flex; flex-direction: column; align-items: center; }
        /* PS1 VRAM is 1024x512, let's scale it down for the browser view if needed, or keep it 1:1 */
        canvas { background: #000; border: 2px solid #333; image-rendering: pixelated; }
    </style>
</head>
<body>
    <h1>Zig PS1</h1>
    <!-- Displaying the raw 1024x512 VRAM -->
    <canvas id="screen" width="1024" height="512"></canvas>
    
    <script>
        const canvas = document.getElementById('screen');
        const ctx = canvas.getContext('2d');
        
        let currentWidth = 0;
        let currentHeight = 0;
        let imageData = null;

        let wasmExports = null;
        let wasmMemory = null;

        async function init() {
            const response = await fetch('zig-out/bin/emulator.wasm');
            const wasm = await WebAssembly.instantiateStreaming(response, {
                env: {
                    // Provide dummy imports if Zig expects any
                }
            });

            wasmExports = wasm.instance.exports;
            wasmMemory = wasmExports.memory;

            // Initialize emulator and load BIOS
            wasmExports.init();

            // Start the emulator loop
            requestAnimationFrame(loop);
        }

        function loop() {
            // Run the CPU for 1 frame (~564,480 cycles)
            wasmExports.stepFrame();

            // Check if the PS1 turned off the display (e.g., during loading screens)
            if (!wasmExports.isDisplayEnabled()) {
                requestAnimationFrame(loop);
                return;
            }

            const width = wasmExports.getDisplayWidth();
            const height = wasmExports.getDisplayHeight();
            const startX = wasmExports.getDisplayVramX();
            const startY = wasmExports.getDisplayVramY();

            // Dynamically resize the canvas and ImageData buffer if the PS1 changes resolution
            if (width !== currentWidth || height !== currentHeight) {
                canvas.width = width;
                canvas.height = height;
                currentWidth = width;
                currentHeight = height;
                imageData = ctx.createImageData(width, height);
            }

            // Grab the pointer to the VRAM array from Zig
            const vramPtr = wasmExports.getVramPtr();
            
            // Create a view into WebAssembly memory (1024 * 512 pixels * 2 bytes per pixel)
            const vramView = new Uint16Array(wasmMemory.buffer, vramPtr, 1024 * 512);

            // Loop over the specific display window, NOT the whole VRAM
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    // Map the screen coordinate to the actual VRAM coordinate
                    const vramX = (startX + x) & 0x3FF;
                    const vramY = (startY + y) & 0x1FF;
                    
                    const vramIdx = vramY * 1024 + vramX;
                    const color16 = vramView[vramIdx];

                    const r = (color16 & 0x001F) << 3;
                    const g = ((color16 >> 5) & 0x001F) << 3;
                    const b = ((color16 >> 10) & 0x001F) << 3;

                    const outIdx = (y * width + x) * 4;
                    imageData.data[outIdx + 0] = r;
                    imageData.data[outIdx + 1] = g;
                    imageData.data[outIdx + 2] = b;
                    imageData.data[outIdx + 3] = 255; 
                }
            }

            // Paint the pixels to the screen
            ctx.putImageData(imageData, 0, 0);

            // Loop
            requestAnimationFrame(loop);
        }

        init();
    </script>
</body>
</html>
